<script>
  // Simple interactive timer logic
  (function () {
    let timeLeft = 15;
    const timerDisplay = document.getElementById('timer-display');
    const timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft -= 1;
        if (timerDisplay) {
          timerDisplay.textContent = timeLeft + 's';
        }
      } else {
        clearInterval(timerInterval);
        if (timerDisplay) {
          timerDisplay.textContent = '¡Listo!';
          timerDisplay.parentElement.classList.remove('bg-renglon-tierra-light', 'text-renglon-tierra');
          timerDisplay.parentElement.classList.add('bg-renglon-pasto-light', 'text-status-completed');
        }
      }
    }, 1000);

    // Checklist interactive updates
    const checkboxes = document.querySelectorAll('#checklist-group input[type="checkbox"]');
    const counterBadge = document.getElementById('checklist-counter');

    function updateCount() {
      const checked = document.querySelectorAll('#checklist-group input[type="checkbox"]:checked').length;
      if (counterBadge) {
        counterBadge.textContent = `${checked} de ${checkboxes.length}`;
        if (checked === checkboxes.length) {
          counterBadge.classList.remove('bg-surface-container', 'text-on-surface-variant');
          counterBadge.classList.add('bg-renglon-pasto-light', 'text-status-completed');
        }
      }
    }

    checkboxes.forEach((cb) => {
      cb.addEventListener('change', (e) => {
        const spanText = e.target.parentElement.querySelector('span.font-body-md');
        if (e.target.checked) {
          spanText.classList.add('line-through', 'text-on-surface-variant');
        } else {
          spanText.classList.remove('line-through', 'text-on-surface-variant');
        }
        updateCount();
      });
    });

    // Simple CTA feedback interaction
    const finishBtn = document.getElementById('finish-btn');
    if (finishBtn) {
      finishBtn.addEventListener('click', () => {
        finishBtn.innerHTML = `
          <span class="material-symbols-outlined text-[24px]">task_alt</span>
          <span>¡Manos listas! Abriendo cuaderno...</span>
        `;
        finishBtn.classList.remove('bg-primary');
        finishBtn.classList.add('bg-status-completed');
        finishBtn.style.boxShadow = '0 4px 0 #15803D';
      });
    }
  })();
